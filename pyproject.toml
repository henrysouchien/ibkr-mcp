[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interactive-brokers-mcp"
version = "0.2.8"
description = "MCP server for Interactive Brokers Gateway — 7 tools for market data and account access via Claude"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.11"
dependencies = [
    "ib_async>=2.1,<3",
    "nest_asyncio>=1.6,<2",
    "pandas>=3.0.5,<4",
    "pyarrow>=23.0.1,<24",
    "pyyaml>=6.0.3,<7",
    "python-dotenv>=1.2.2,<2",
    "fastmcp>=3.2.4,<5",
    "certifi>=2026.2.25,<2027",
    "zstandard>=0.25.0,<1",
    "brokerage-connect[ibkr]>=0.6.5,<1",
]

[project.urls]
Homepage = "https://github.com/henrysouchien/ibkr-mcp"
Source = "https://github.com/henrysouchien/ibkr-mcp"

[project.scripts]
ibkr-mcp = "ibkr.server:main"

[tool.hatch.build.targets.wheel]
packages = ["ibkr_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "ibkr/__init__.py"
"server.py" = "ibkr/server.py"

[tool.hatch.build.targets.sdist]
include = ["/*.py", "/ibkr_mcp", "pyproject.toml", "README.md", "LICENSE"]
